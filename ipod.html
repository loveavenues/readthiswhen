<!--IPOD-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Playlist</title>
    <style>
        @font-face {
            font-family: "myriad";
            src: url("https://files.catbox.moe/s0igcb.OTF");
          }
          
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s;
            list-style: none;
          }
          
          body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f6f6f6;
            transform-style: preserve-3d;
            font-family: "myriad";
          }
          
          .ipod {
            background: #ececec;
            width: 240px;
            height: 360px;
            border-radius: 20px;
            position: relative;
            box-shadow: inset 5px 0px 15px 10px #00000090;
          }
          
          .ipod .screen {
            background: #fff;
            overflow: hidden;
            position: absolute;
            left: 50%;
            top: 15px;
            transform: translate(-50%, 0);
            width: 200px;
            height: 160px;
            border-radius: 8px;
            border: 2px solid #aaa;
            box-shadow: inset 0 0 0px 2px #222;
          }
          
          .ipod .controls {
            background: #fff;
            position: absolute;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 0);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 0.5px solid #ccc;
            box-shadow: inset 0px 0px 5px 1px #00000050;
          }
          
          .ipod .controls:before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ececec;
            box-shadow: inset 24px 24px 48px #c6c6c6, inset -24px -24px 48px #ffffff;
            border: 0.5px solid #ccc;
          }
          
          .ipod .controls .fa-fast-backward {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translate(0, -50%);
            color: #aaa;
            font-size: 1.2em;
            cursor: pointer;
          }
          
          .ipod .controls .fa-fast-backward:active {
            color: #888;
          }
          
          .ipod .controls .fa-fast-forward {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translate(0, -50%);
            color: #aaa;
            font-size: 1.2em;
            cursor: pointer;
          }
          
          .ipod .controls .fa-fast-forward:active {
            color: #888;
          }
          
          .ipod .controls .menu {
            position: absolute;
            left: 50%;
            top: 20px;
            transform: translate(-50%, 0);
            color: #aaa;
            font-size: 0.9em;
            font-weight: 700;
            border: 0;
            outline: 0;
            background: none;
            cursor: default; /* Keeps the menu button but disables interaction */
          }
          
          .ipod .controls .menu:active {
            color: #888;
          }
          
          .ipod .controls .play-pause-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 0);
            border: 0;
            outline: 0;
            background: none;
            color: #aaa;
            font-size: 1em;
            cursor: pointer;
          }
          
          .ipod .controls .play-pause-btn:active {
            color: #888;
          }
          
          .ipod .screen .music {
            padding: 15px;
            display: flex;
            gap: 15px;
          }
          
          .ipod .screen .music img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            -webkit-box-reflect: below 2px
              linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.09));
          }
          
          .ipod .screen .music .content .name {
            font-size: 0.95em;
          }
          
          .ipod .screen .music .content .singer {
            font-size: 0.55em;
            font-family: "myriad";
          }
          
          .ipod .screen .music .content .date {
            font-size: 0.85em;
            font-weight: 700;
          }
          
          .ipod .screen .bar-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
            width: 100%;
            position: absolute;
            bottom: 30px;
          }
          
          .ipod .screen .bar-box .bar {
            width: 80px;
            height: 10px;
            font-family: "myriad";
            border: 1px solid #aaa;
          }
          
          .ipod .screen .bar-box .bar .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(
              to bottom,
              #f2f6f8 0%,
              #d8e1e7 50%,
              #b5c6d0 51%,
              #e0eff9 100%
            );
          }       
          
          .back-btn {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: #fff;         /* white background */
            border: 2px solid #333;   /* dark gray border */
            border-radius: 12px;
            font-family: "myriad";
            font-weight: 700;
            color: #111;               /* black text */
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s;
            z-index: 1000;
        }
        
        .back-btn:hover {
            background: #f0f0f0;      /* light gray on hover */
            transform: translateX(-50%) scale(1.05);
        }
        
        
    </style>
</head>
<body>

    <div class="ipod">
        <div class="screen">
          <div style="background: linear-gradient(to bottom, #fff 0%, #9e9e9e 100%); border-bottom: 1px solid #5c5c5c; border-right: 2px solid #000; border-left: 2px solid #000; font-size: 12px; padding: 1px;">now playing</div>
          <div class="music">
            <audio id="myMusic" src="https://files.catbox.moe/reqe54.mp3" type="audio/mp3"></audio>
            <img id="poster" src="./rearrange.jpeg">
            <div class="content">
              <b class="name">Rearrange my world</b>
              <p class="singer">Daniel Caesar, Rex Orange County</p>
              <p class="date">2023</p>
            </div>
          </div>
      
          <div class="bar-box">
            <p class="current-time">0:00</p>
            <div class="bar">
              <div class="progress"></div>
            </div>
            <p class="duration-time">5:36</p>
          </div>
        </div>
        <!--screen-->
      
        <div class="controls">
          <button class="menu">MENU</button>
          <i class="fa fa-fast-backward"></i>
          <i class="fa fa-fast-forward"></i>
          <button class="play-pause-btn">
            <i class="fa fa-play"></i>
            <i class="fa fa-pause"></i>
          </button>
        </div>
      </div>

      <button class="back-btn" onclick="goBack()">← Back</button>
      <script>
            let music = document.querySelector("#myMusic");
            let poster = document.querySelector("#poster");
            let name = document.querySelector(".name");
            let singer = document.querySelector(".singer");
            let date = document.querySelector(".date");
            
            let back = document.querySelector(".fa-fast-backward");
            let next = document.querySelector(".fa-fast-forward");
            let ppBtn = document.querySelector(".play-pause-btn");
            
            let progress = document.querySelector(".progress");
            let currentTiming = document.querySelector(".current-time");
            let durationTime = document.querySelector(".duration-time");
            
            const songs = [
              { name: "Rearrange my world", singer: "Daniel Caesar, Rex Orange County", year: "2023", poster: "./rearrange.jpeg", audio: "./Daniel Caesar, Rex Orange County - Rearrange My World (Audio).mp3" },
              { name: "Ikaw at Ako", singer: "Johnoy Danao", year: "2023", poster: "./ikaw.jpeg", audio: "./Ikaw at ako ( with lyrics)  johnoy danao.mp3" },
              { name: "Give You the World", singer: "Steve Lacy", year: "2023", poster: "./give you.jpg", audio: "./Give You the World.mp3" },
              { name: "Stand by Me", singer: "Ben E. King", year: "1961", poster: "./stand.jpeg", audio: "./Ben E. King - Stand By Me (Audio).mp3" },
              { name: "Sparks", singer: "Coldplay", year: "2000", poster: "./sparks.jpeg", audio: "./coldplay - sparks (lyrics).mp3" },
              { name: "Panaginip", singer: "Nicole", year: "2023", poster: "./panaginip.png", audio: "./Panaginip - nicole (Official Lyric Video).mp3" },
              { name: "You'll Be in My Heart", singer: "NIKI", year: "2023", poster: "./in my heart.jpeg", audio: "./NIKI - You'll be in my heart.mp3" },
              { name: "Light Shower", singer: "Melanie Martinez", year: "2023", poster: "./light shower.jpg", audio: "./LIGHT SHOWER - Melanie Martinez (Lyrics).mp3" },
              { name: "To the Bone", singer: "Pamungkas", year: "2023", poster: "./to the bone.png", audio: "./Pamungkas - To the bone (lyrics).mp3" },
              { name: "A Couple of Minutes", singer: "Olivia Dean", year: "2023", poster: "./couple.jpg", audio: "./Olivia Dean - A Couple Minutes (Lyric Video).mp3" },
              { name: "About You", singer: "The 1975", year: "2023", poster: "https://i.scdn.co/image/ab67616d0000b2731f44db452a68e229650a302c", audio: "./The 1975 - About You (Official).mp3" },
              { name: "Can't Help Falling in Love", singer: "Elvis Presley", year: "1961", poster: "./cant help.png", audio: "./Elvis Presley - Can't Help Falling in Love (Lyrics).mp3" },
              { name: "Magnets", singer: "NIKI", year: "2023", poster: "./magnets.jpeg", audio: "./NIKI - Magnets (Lyrics).mp3" },
              { name: "Tadhana", singer: "Up Dharma Down", year: "2023", poster: "./tadhana.jpeg", audio: "./Tadhana - Up Dharma Down [Lyrics] [1080p].mp3" },
              { name: "Dress", singer: "Taylor Swift", year: "2023", poster: "https://i.scdn.co/image/ab67616d0000b273da5d5aeeabacacc1263c0f4b", audio: "./Dress.mp3" },
              { name: "Mundo", singer: "IV OF SPADES", year: "2023", poster: "https://i.scdn.co/image/ab67616d0000b273b13cedfd0561ede2aaaa0947", audio: "./Mundo.mp3" },
              { name: "Hrs & Hrs", singer: "Muni Long", year: "2023", poster: "https://i1.sndcdn.com/artworks-GOvUjfkbAQNa-0-t500x500.jpg", audio: "./Muni Long - Hrs and Hrs (Official Audio).mp3" },
              { name: "Company", singer: "Justin Bieber", year: "2023", poster: "https://i.scdn.co/image/ab67616d0000b273f46b9d202509a8f7384b90de", audio: "./Justin Bieber - Company (Lyrics).mp3" },
              { name: "Slut!", singer: "Taylor Swift", year: "2023", poster: "https://external-preview.redd.it/taylor-swifts-new-song-slut-is-about-more-than-just-the-v0-bwZENaKgSloxG5tTxiOfNBP-Yj8c5aeTgf1cfdngf4k.jpg?width=640&crop=smart&auto=webp&s=20553cc1affaf746c4e8e7e1afc93e38bb623c7b", audio: "./Taylor Swift - Slut! (Lyrics).mp3" },
              { name: "Kiss Me Thru the Phone", singer: "Soulja Boy, Sammie", year: "2008", poster: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7Zrex72_dNN1FSj3jzPixeCnopIUkIFt1dA&s", audio: "./Soulja Boy - Kiss Me Thru The Phone (Lyrics) ft. Sammie.mp3" },
              { name: "Malay Ko", singer: "Daniel Padilla", year: "2023", poster: "https://cdn-images.dzcdn.net/images/cover/6e0bb7dc0d9edc3d7099da21276a97d2/1900x1900-000000-80-0-0.jpg", audio: "./Daniel Padilla - Malay Ko (Lyrics)(The Hows of Us OST).mp3" },
              { name: "Adorn", singer: "Miguel", year: "2012", poster: "https://i.scdn.co/image/ab67616d0000b273fc67af03f71d54b3519a6dd5", audio: "./Miguel - Adorn (Lyrics).mp3" },
              { name: "Folded", singer: "Kehlani", year: "2023", poster: "https://upload.wikimedia.org/wikipedia/en/3/36/Kehlani_-_Folded.jpg", audio: "./Kehlani - Folded (Lyrics) [BclvXp0t-G0].mp3" },
              { name: "Multo", singer: "Cup of Joe", year: "2023", poster: "https://i.scdn.co/image/ab67616d0000b273394048503e3be0e65e962638", audio: "./Multo - Cup of Joe (Official Lyric Video).mp3" },
              { name: "Tibok", singer: "Earl Agustin", year: "2023", poster: "https://i.scdn.co/image/ab67616d0000b273e0021775c459dd31cdc7115a", audio: "./Tibok - Earl Agustin (Lyrics).mp3" },
              { name: "Nandito Ako", singer: "Rob Deniel", year: "2023", poster: "https://i1.sndcdn.com/artworks-QJ8I3Vi7w7p3XzRk-GxREng-t500x500.jpg", audio: "./Rob Deniel - NANDITO AKO (Cover with Lyrics).mp3" }
            ]; 

        let isPlaying = false;

        const playAudio = () => {
        isPlaying = true;
        music.play();
        };

        const pauseAudio = () => {
        isPlaying = false;
        music.pause();
        };

        ppBtn.addEventListener("click", () => {
        const playIcon = ppBtn.querySelector(".fa-play");
        const pauseIcon = ppBtn.querySelector(".fa-pause");
        if (isPlaying) {
            pauseAudio();
            playIcon.style.display = "inline";
            pauseIcon.style.display = "none";
        } else {
            playAudio();
            playIcon.style.display = "none";
            pauseIcon.style.display = "inline";
        }
        });

        const loadSongs = (song) => {
        name.innerText = song.name;
        singer.innerText = song.singer;
        date.innerText = song.year;
        poster.src = song.poster;
        music.src = song.audio;
        };

        let songIndex = 0;

        const nextSong = () => {
        songIndex = (songIndex + 1) % songs.length;
        loadSongs(songs[songIndex]);
        playAudio();
        };

        const prevSong = () => {
        songIndex = (songIndex - 1 + songs.length) % songs.length;
        loadSongs(songs[songIndex]);
        playAudio();
        };

        next.addEventListener("click", nextSong);
        back.addEventListener("click", prevSong);

        music.addEventListener("timeupdate", (event) => {
        const { currentTime, duration } = event.srcElement;
        let current = (currentTime / duration) * 100;
        progress.style.width = current + "%";

        let min_duration = Math.floor(duration / 60);
        let sec_duration = Math.floor(duration % 60);
        durationTime.innerText = duration
            ? `${min_duration}:${sec_duration < 10 ? "0" + sec_duration : sec_duration}`
            : "0:00";

        let min_current = Math.floor(currentTime / 60);
        let sec_current = Math.floor(currentTime % 60);
        currentTiming.innerText = `${min_current}:${
            sec_current < 10 ? "0" + sec_current : sec_current
        }`;
        });

        music.addEventListener("ended", nextSong);

        window.addEventListener("load", () => {
        loadSongs(songs[songIndex]);
        });

        function goBack() {
            window.location.href = "index.html";
        }
        
      </script>
</body>
</html>
